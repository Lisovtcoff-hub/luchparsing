name: One-time security purge

on:
  issues:
    types: [opened]

permissions:
  contents: write

jobs:
  purge:
    if: github.event.issue.title == 'SECURITY-PURGE-LUCHPARSING-2026'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out complete history
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Install git-filter-repo
        run: python -m pip install --disable-pip-version-check git-filter-repo

      - name: Remove .env from all reachable commits
        run: git filter-repo --path .env --invert-paths --force

      - name: Force-push sanitized history
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "security: complete history purge"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin HEAD:main
