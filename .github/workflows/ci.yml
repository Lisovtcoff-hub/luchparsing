name: CI

on:
  push:
  pull_request:

jobs:
  lint-build-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Smoke tests (import + compile)
        env:
          PANEL_USER: ci
          PANEL_PASSWORD: ci
        run: |
          python -m compileall .
          python -c "import app; print('import ok')"

      - name: Build Docker image
        run: docker build -t luchparsing:ci .
